<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Generala</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#111;color:#fff;padding:20px}.contenedor{max-width:900px;margin:20px auto;background:#1d1d1d;padding:24px;border-radius:20px}h1{text-align:center}.jugadores{display:grid;grid-template-columns:1fr 1fr;gap:14px}.jugador{background:#292929;padding:16px;border-radius:14px}.jugador h2{text-align:center;color:#00d9ff}.nombre{width:100%;padding:10px;border-radius:9px;border:1px solid #555;background:#111;color:#fff;margin-bottom:12px}.dados{width:100%;padding:12px;border-radius:9px;border:1px solid #555;background:#111;color:#fff;font-size:18px}.calcular{width:100%;margin-top:10px;padding:11px;border:0;border-radius:10px;background:#00d9ff;color:#000;font-weight:bold;cursor:pointer}.tablero{margin-top:20px;overflow-x:auto}.fila{display:grid;grid-template-columns:1fr 100px 100px;gap:8px;margin:7px 0;align-items:center}.fila input{width:100%;padding:10px;border-radius:9px;border:1px solid #555;background:#111;color:#fff;text-align:center}.total{margin-top:18px;padding:16px;background:#292929;border-radius:14px;text-align:center;font-size:28px;font-weight:bold;color:#00d9ff}.reiniciar{width:100%;margin-top:14px;padding:12px;border:0;border-radius:10px;background:#00d9ff;color:#000;font-weight:bold;cursor:pointer}.encabezado{font-weight:bold;text-align:center}@media(max-width:650px){.jugadores{grid-template-columns:1fr}.fila{grid-template-columns:1fr 85px 85px}}
</style>
</head>
<body>
<main class="contenedor">
<h1>🎲 Generala</h1>
<div class="jugadores">
<div class="jugador">
<h2>Jugador 1</h2>
<input id="nombre1" class="nombre" value="Jugador 1">
<input id="dados1" class="dados" placeholder="Ej: 1 2 3 4 5">
<button class="calcular" onclick="calcular(1)">Calcular jugada</button>
</div>
<div class="jugador">
<h2>Jugador 2</h2>
<input id="nombre2" class="nombre" value="Jugador 2">
<input id="dados2" class="dados" placeholder="Ej: 1 2 3 4 5">
<button class="calcular" onclick="calcular(2)">Calcular jugada</button>
</div>
</div>
<div class="tablero">
<div class="fila encabezado"><span>Categoría</span><span>Jugador 1</span><span>Jugador 2</span></div>
<div class="fila"><span>1</span><input id="j1_1" type="number" min="0" value="0"><input id="j2_1" type="number" min="0" value="0"></div>
<div class="fila"><span>2</span><input id="j1_2" type="number" min="0" value="0"><input id="j2_2" type="number" min="0" value="0"></div>
<div class="fila"><span>3</span><input id="j1_3" type="number" min="0" value="0"><input id="j2_3" type="number" min="0" value="0"></div>
<div class="fila"><span>4</span><input id="j1_4" type="number" min="0" value="0"><input id="j2_4" type="number" min="0" value="0"></div>
<div class="fila"><span>5</span><input id="j1_5" type="number" min="0" value="0"><input id="j2_5" type="number" min="0" value="0"></div>
<div class="fila"><span>6</span><input id="j1_6" type="number" min="0" value="0"><input id="j2_6" type="number" min="0" value="0"></div>
<div class="fila"><span>Escalera</span><input id="j1_escalera" type="number" min="0" value="0"><input id="j2_escalera" type="number" min="0" value="0"></div>
<div class="fila"><span>Full</span><input id="j1_full" type="number" min="0" value="0"><input id="j2_full" type="number" min="0" value="0"></div>
<div class="fila"><span>Póker</span><input id="j1_poker" type="number" min="0" value="0"><input id="j2_poker" type="number" min="0" value="0"></div>
<div class="fila"><span>Generala</span><input id="j1_generala" type="number" min="0" value="0"><input id="j2_generala" type="number" min="0" value="0"></div>
<div class="fila"><span>Generala doble</span><input id="j1_doble" type="number" min="0" value="0"><input id="j2_doble" type="number" min="0" value="0"></div>
<div class="fila"><span>Chance</span><input id="j1_chance" type="number" min="0" value="0"><input id="j2_chance" type="number" min="0" value="0"></div>
</div>
<div class="total">Total: <span id="total1">0</span> — <span id="total2">0</span></div>
<button class="reiniciar" onclick="reiniciar()">Reiniciar partida</button>
</main>
<script>
const categorias=['1','2','3','4','5','6','escalera','full','poker','generala','doble','chance'];
function obtenerDados(n){return document.getElementById('dados'+n).value.trim().split(/\s+/).map(Number).filter(x=>Number.isInteger(x)&&x>=1&&x<=6)}
function calcular(n){
 const d=obtenerDados(n); if(d.length!==5){alert('Ingresá exactamente 5 dados, por ejemplo: 1 2 3 4 5');return}
 const c=[0,0,0,0,0,0,0]; d.forEach(x=>c[x]++);
 for(let i=1;i<=6;i++) document.getElementById('j'+n+'_'+i).value=c[i]*i;
 const orden=d.slice().sort((a,b)=>a-b).join('');
 const escalera=orden==='12345'||orden==='23456';
 const full=c.includes(3)&&c.includes(2);
 const poker=c.some(x=>x===4);
 const generala=c.some(x=>x===5);
 const chance=d.reduce((a,b)=>a+b,0);
 document.getElementById('j'+n+'_escalera').value=escalera?20:0;
 document.getElementById('j'+n+'_full').value=full?30:0;
 document.getElementById('j'+n+'_poker').value=poker?40:0;
 document.getElementById('j'+n+'_generala').value=generala?50:0;
 document.getElementById('j'+n+'_doble').value=0;
 document.getElementById('j'+n+'_chance').value=chance;
 actualizar();
}
function actualizar(){for(let n=1;n<=2;n++){let total=0;categorias.forEach(c=>{total+=Number(document.getElementById('j'+n+'_'+c).value)||0});document.getElementById('total'+n).textContent=total}}
document.querySelectorAll('input[type=number]').forEach(i=>i.addEventListener('input',actualizar));
function reiniciar(){document.querySelectorAll('input[type=number]').forEach(i=>i.value=0);document.getElementById('dados1').value='';document.getElementById('dados2').value='';actualizar()}
</script>
</body>
</html>
