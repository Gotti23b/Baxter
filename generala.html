<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Generala</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#111;color:#fff;padding:20px}
.contenedor{max-width:850px;margin:20px auto;background:#1d1d1d;padding:24px;border-radius:20px}
h1{text-align:center}
label{display:block;margin:10px 0 6px;font-weight:bold}
.dados-box{background:#292929;padding:16px;border-radius:14px;margin-bottom:20px}
#dados{width:100%;padding:14px;border-radius:10px;border:1px solid #555;background:#111;color:#fff;font-size:20px;text-align:center}
button{border:0;border-radius:10px;padding:12px 16px;font-weight:bold;cursor:pointer;margin-top:10px}
.calcular{width:100%;background:#00d9ff;color:#000}
.mensaje{text-align:center;margin-top:10px;min-height:22px}
.resultados{display:grid;grid-template-columns:1fr 120px;gap:8px;margin-top:14px}
.resultados div{padding:10px;border-radius:8px;background:#111}
.resultados .valor{text-align:center;font-weight:bold;color:#00d9ff}
.tablero{margin-top:22px}
.fila{display:grid;grid-template-columns:1fr 100px;gap:8px;margin:7px 0}
.fila input{width:100%;padding:10px;border-radius:9px;border:1px solid #555;background:#111;color:#fff}
.fila input[type=number]{text-align:center}
.total{margin-top:18px;padding:16px;background:#292929;border-radius:14px;text-align:center;font-size:28px;font-weight:bold;color:#00d9ff}
.reiniciar{width:100%;margin-top:14px;background:#00d9ff;color:#000}
@media(max-width:500px){.contenedor{padding:16px}.resultados{grid-template-columns:1fr 90px}}
</style>
</head>
<body>
<main class="contenedor">
<h1>🎲 Generala</h1>

<div class="dados-box">
<label for="dados">Poné los 5 dados</label>
<input id="dados" inputmode="numeric" placeholder="Ej: 1 2 3 4 5">
<button class="calcular" onclick="calcularDados()">Calcular jugada</button>
<div id="mensaje" class="mensaje"></div>
<div id="resultados" class="resultados" style="display:none"></div>
</div>

<label>Jugador</label>
<input id="nombre" value="Jugador 1" style="width:100%;padding:10px;border-radius:9px;border:1px solid #555;background:#111;color:#fff">

<div class="tablero">
<label>Completá los puntos de cada categoría</label>
<div class="fila"><span>1</span><input type="number" min="0" value="0" class="punto"></div>
<div class="fila"><span>2</span><input type="number" min="0" value="0" class="punto"></div>
<div class="fila"><span>3</span><input type="number" min="0" value="0" class="punto"></div>
<div class="fila"><span>4</span><input type="number" min="0" value="0" class="punto"></div>
<div class="fila"><span>5</span><input type="number" min="0" value="0" class="punto"></div>
<div class="fila"><span>6</span><input type="number" min="0" value="0" class="punto"></div>
<div class="fila"><span>Escalera</span><input type="number" min="0" value="0" class="punto"></div>
<div class="fila"><span>Full</span><input type="number" min="0" value="0" class="punto"></div>
<div class="fila"><span>Póker</span><input type="number" min="0" value="0" class="punto"></div>
<div class="fila"><span>Generala</span><input type="number" min="0" value="0" class="punto"></div>
<div class="fila"><span>Generala doble</span><input type="number" min="0" value="0" class="punto"></div>
</div>

<div class="total">Total: <span id="total">0</span></div>
<button class="reiniciar" onclick="reiniciar()">Reiniciar partida</button>
</main>
<script>
const inputs=document.querySelectorAll('.punto');

function actualizar(){
 let total=0;
 inputs.forEach(i=>total+=Number(i.value)||0);
 document.getElementById('total').textContent=total;
}
inputs.forEach(i=>i.addEventListener('input',actualizar));

function calcularDados(){
 const texto=document.getElementById('dados').value.trim();
 const dados=texto.split(/[\s,;]+/).filter(Boolean).map(Number);
 const mensaje=document.getElementById('mensaje');
 const resultados=document.getElementById('resultados');

 if(dados.length!==5 || dados.some(d=>!Number.isInteger(d)||d<1||d>6)){
   mensaje.textContent='⚠️ Poné exactamente 5 dados, del 1 al 6. Ej: 1 2 3 4 5';
   resultados.style.display='none';
   return;
 }

 const c=[0,0,0,0,0,0,0];
 dados.forEach(d=>c[d]++);
 const escalera=(dados.slice().sort((a,b)=>a-b).join('')==='12345'||dados.slice().sort((a,b)=>a-b).join('')==='23456');
 const full=Object.values(c).includes(3)&&Object.values(c).includes(2);
 const poker=Object.values(c).includes(4);
 const generala=Object.values(c).includes(5);
 const suma=n=>dados.filter(d=>d===n).reduce((a,b)=>a+b,0);

 const valores=[
   suma(1),suma(2),suma(3),suma(4),suma(5),suma(6),
   escalera?20:0,
   full?30:0,
   poker?40:0,
   generala?50:0,
   generala?100:0
 ];

 const nombres=['1','2','3','4','5','6','Escalera','Full','Póker','Generala','Generala doble'];
 resultados.innerHTML=nombres.map((n,i)=>`<div>${n}</div><div class="valor">${valores[i]}</div>`).join('');
 resultados.style.display='grid';
 mensaje.textContent=generala?'🎉 ¡Generala!':full?'🎲 ¡Full!':poker?'🎲 ¡Póker!':escalera?'🎲 ¡Escalera!':'✅ Dados calculados';
}

function reiniciar(){
 document.getElementById('dados').value='';
 document.getElementById('mensaje').textContent='';
 document.getElementById('resultados').style.display='none';
 inputs.forEach(i=>i.value=0);
 actualizar();
}
</script>
</body>
</html>
