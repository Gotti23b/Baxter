<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Generala</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#111;color:#fff;padding:20px}.contenedor{max-width:850px;margin:20px auto;background:#1d1d1d;padding:24px;border-radius:20px}h1{text-align:center}.tablero{overflow-x:auto}.fila{display:grid;grid-template-columns:1fr 100px;gap:8px;margin:7px 0}.fila input{width:100%;padding:10px;border-radius:9px;border:1px solid #555;background:#111;color:#fff}.fila input[type=number]{text-align:center}.total{margin-top:18px;padding:16px;background:#292929;border-radius:14px;text-align:center;font-size:28px;font-weight:bold;color:#00d9ff}.reiniciar{width:100%;margin-top:14px;padding:12px;border:0;border-radius:10px;background:#00d9ff;color:#000;font-weight:bold;cursor:pointer}label{display:block;margin:8px 0;font-weight:bold}
</style>
</head>
<body>
<main class="contenedor">
<h1>🎲 Generala</h1>
<label>Jugador</label>
<input id="nombre" value="Jugador 1" style="width:100%;padding:10px;border-radius:9px;border:1px solid #555;background:#111;color:#fff">
<div class="tablero">
<label>Completá los puntos de cada categoría</label>
<div class="fila"><span>1</span><input type="number" min="0" value="0" class="punto"></div>
<div class="fila"><span>2</span><input type="number" min="0" value="0" class="punto"></div>
<div class="fila"><span>3</span><input type="number" min="0" value="0" class="punto"></div>
<div class="fila"><span>4</span><input type="number" min="0" value="0" class="punto"></div>
<div class="fila"><span>5</span><input type="number" min="0" value="0" class="punto"></div>
<div class="fila"><span>6</span><input type="number" min="0" value="0" class="punto"></div>
<div class="fila"><span>Escalera</span><input type="number" min="0" value="0" class="punto"></div>
<div class="fila"><span>Full</span><input type="number" min="0" value="0" class="punto"></div>
<div class="fila"><span>Póker</span><input type="number" min="0" value="0" class="punto"></div>
<div class="fila"><span>Generala</span><input type="number" min="0" value="0" class="punto"></div>
<div class="fila"><span>Generala doble</span><input type="number" min="0" value="0" class="punto"></div>
<div class="fila"><span>Chance</span><input type="number" min="0" value="0" class="punto"></div>
</div>
<div class="total">Total: <span id="total">0</span></div>
<button class="reiniciar" onclick="reiniciar()">Reiniciar partida</button>
</main>
<script>
const inputs=document.querySelectorAll('.punto');
function actualizar(){let total=0;inputs.forEach(i=>total+=Number(i.value)||0);document.getElementById('total').textContent=total}
inputs.forEach(i=>i.addEventListener('input',actualizar));
function reiniciar(){inputs.forEach(i=>i.value=0);actualizar()}
</script>
</body>
</html>
