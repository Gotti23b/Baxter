<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portal Cósmico</title>

<style>
body{
    margin:0;
    overflow:hidden;
    background:black;
    font-family:Arial;
}

canvas{
    position:fixed;
    inset:0;
}

#texto{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    color:white;
    text-align:center;
    z-index:10;
}

h1{
    font-size:60px;
    margin:0;
    text-shadow:0 0 20px cyan;
}

p{
    opacity:0.8;
}

button{
    padding:15px 25px;
    border:none;
    background:cyan;
    color:black;
    font-weight:bold;
    cursor:pointer;
    border-radius:10px;
    transition:0.3s;
}

button:hover{
    transform:scale(1.1);
    box-shadow:0 0 30px cyan;
}
</style>
</head>
<body>

<canvas id="c"></canvas>

<div id="texto">
    <h1>🌌 PORTAL</h1>
    <p>No toques el botón... 👀</p>
    <button onclick="boom()">Abrir portal</button>
</div>

<script>
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");

canvas.width = innerWidth;
canvas.height = innerHeight;

let stars = [];

for(let i=0;i<2000;i++){
    stars.push({
        x:(Math.random()-0.5)*2000,
        y:(Math.random()-0.5)*2000,
        z:Math.random()*2000
    });
}

function draw(){
    ctx.fillStyle="rgba(0,0,0,0.3)";
    ctx.fillRect(0,0,canvas.width,canvas.height);

    for(let s of stars){
        s.z -= 10;

        if(s.z<=0){
            s.z=2000;
        }

        let x = (s.x/s.z)*800 + canvas.width/2;
        let y = (s.y/s.z)*800 + canvas.height/2;

        let size = (1-s.z/2000)*5;

        ctx.fillStyle="cyan";
        ctx.beginPath();
        ctx.arc(x,y,size,0,Math.PI*2);
        ctx.fill();
    }

    requestAnimationFrame(draw);
}

draw();

function boom(){

    document.body.style.background="white";

    setTimeout(()=>{
        document.body.style.background="black";
    },100);

    for(let i=0;i<500;i++){
        stars.push({
            x:(Math.random()-0.5)*2000,
            y:(Math.random()-0.5)*2000,
            z:Math.random()*500
        });
    }

    document.querySelector("h1").innerText="🌀 VIAJANDO...";
}
</script>

</body>
</html>
