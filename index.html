<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Grupal - Baxter</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="chat-container">
        <!-- Header -->
        <div class="chat-header">
            <h1>💬 Chat Grupal</h1>
            <p class="subtitle">Sin login • Mensajes guardados en JSON</p>
        </div>

        <!-- Setup Usuario -->
        <div class="user-setup" id="userSetup">
            <div class="setup-card">
                <h2>Bienvenido al Chat</h2>
                <input 
                    type="text" 
                    id="userName" 
                    placeholder="Escribe tu nombre de usuario"
                    maxlength="20"
                >
                <button onclick="startChat()">Entrar al Chat</button>
            </div>
        </div>

        <!-- Chat Principal -->
        <div class="chat-main" id="chatMain" style="display: none;">
            
            <!-- Info Usuario -->
            <div class="user-info">
                <span id="userDisplay">Usuario</span>
                <button class="btn-logout" onclick="logout()">Salir</button>
            </div>

            <!-- Mensajes -->
            <div class="messages" id="messages"></div>

            <!-- Input -->
            <div class="chat-input-area">
                <input 
                    type="text" 
                    id="messageInput" 
                    placeholder="Escribe un mensaje..."
                    onkeypress="if(event.key==='Enter') sendMessage()"
                >
                <button onclick="sendMessage()" class="btn-send">Enviar</button>
                <button onclick="downloadJSON()" class="btn-download">📥 Descargar JSON</button>
            </div>
        </div>
    </div>

    <script src="chat.js"></script>
</body>
</html>
