<!DOCTYPE html>
<html lang="es"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mi página</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            color: #222;
        }

        .contenedor {
            width: 90%;
            max-width: 1000px;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
        }

        h1 {
            margin-top: 0;
            font-size: 40px;
        }

        p {
            font-size: 18px;
            line-height: 1.6;
        }

        .boton {
            display: inline-block;
            padding: 12px 20px;
            background: #00d9ff;
            color: #000;
            text-decoration: none;
            border-radius: 10px;
            font-weight: bold;
        }
    </style>
</head>

<body style="background: rgb(207, 207, 207);">

    <main class="contenedor" style="border-radius: 40px;">

        <h1>Hola Ma, te amo mucho
</h1>

        <p>Sabias que lo hice solo, sin chat ptg? 
        </p>

        <a href="#" class="boton" style="border-radius: 10px;">
            Si
        </a>

    </main>
