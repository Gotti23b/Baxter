<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>La Papa / 10.000</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:20px;font-family:Arial,sans-serif;background:#0f172a;color:white}.contenedor{max-width:760px;margin:auto;background:#111827;padding:24px;border-radius:20px}h1,h2{text-align:center}.jugadores{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.jugador{background:#1f2937;padding:16px;border-radius:16px;text-align:center}.nombre,#entradaDados{width:100%;padding:11px;border:1px solid #475569;border-radius:10px;background:#0f172a;color:white}.puntos{font-size:38px;font-weight:bold;color:#22d3ee;margin:12px 0}.activo{outline:2px solid #22d3ee}.seccion{margin-top:18px;padding:18px;background:#1f2937;border-radius:16px}.ayuda{text-align:center;color:#cbd5e1;margin:8px 0 14px}#entradaDados{font-size:22px;text-align:center;letter-spacing:4px}button{font:inherit;padding:11px 14px;border:0;border-radius:10px;cursor:pointer;font-weight:bold;margin:4px}.principal{background:#22d3ee;color:#061018}.secundario{background:#334155;color:white}.peligro{background:#7f1d1d;color:white}.turno,.resultado,.mensaje{text-align:center}.turno{font-size:18px;margin:10px 0}.resultado{font-size:24px;color:#22d3ee;font-weight:bold}.mensaje{min-height:24px;margin:10px 0}@media(max-width:600px){.jugadores{grid-template-columns:1fr}}
</style>
</head>
<body>
<main class="contenedor">
<h1>🥔 La Papa / 10.000</h1>
<div class="jugadores">
<section class="jugador activo" id="jugador1"><input class="nombre" id="nombre1" value="Jugador 1"><div class="puntos" id="puntos1">0</div></section>
<section class="jugador" id="jugador2"><input class="nombre" id="nombre2" value="Jugador 2"><div class="puntos" id="puntos2">0</div></section>
</div>
<section class="seccion">
<div class="turno" id="turno">Turno de Jugador 1</div>
<h2>🎲 ¿Qué dados salieron?</h2>
<p class="ayuda">Escribí los 5 números separados por espacios. Ejemplo: <b>1 5 3 3 3</b></p>
<input id="entradaDados" inputmode="numeric" maxlength="9" placeholder="1 5 3 3 3" aria-label="Números de los cinco dados">
<div style="text-align:center"><button class="principal" onclick="calcularTirada()">Calcular</button><button class="secundario" onclick="limpiarDados()">Limpiar</button></div>
<div class="resultado" id="resultado">Puntaje de la tirada: 0</div><div class="mensaje" id="mensaje"></div>
<div style="text-align:center"><button class="secundario" onclick="plantarse()">Plantarse y anotar</button><button class="peligro" onclick="papa()">🥔 ¡PAPA!</button></div>
</section>
<section class="seccion"><div style="text-align:center"><strong>Puntaje del turno: </strong><span id="puntajeTurno">0</span><br><br><button class="secundario" onclick="pasarTurno()">Pasar turno</button><button class="peligro" onclick="reiniciar()">Reiniciar partida</button></div></section>
</main>
<script>
const entradaDados=document.getElementById('entradaDados');let puntos=[0,0],jugadorActual=0,turnoPuntos=0,yaEntro=[false,false];
function nombre(){return document.getElementById('nombre'+(jugadorActual+1)).value||'Jugador '+(jugadorActual+1)}
function obtenerDados(){return entradaDados.value.trim().split(/\s+/).map(Number)}
function calcularPuntaje(v){const c=[0,0,0,0,0,0,0];v.forEach(x=>c[x]++);let p=0;
if((c[1]&&c[2]&&c[3]&&c[4]&&c[5])||(c[2]&&c[3]&&c[4]&&c[5]&&c[6]))return 1000;
for(let n=1;n<=6;n++)if(c[n]>=3){p+=n===1?1000:n*100;if(c[n]===4)p+=n===1?1000:n*100;if(c[n]===5)p+=n===1?1000:n*100}
if(c[1]<3)p+=c[1]*100;if(c[5]<3)p+=c[5]*50;return p}
function calcularTirada(){const v=obtenerDados();if(v.length!==5||v.some(x=>!Number.isInteger(x)||x<1||x>6)){document.getElementById('mensaje').textContent='Poné exactamente 5 números del 1 al 6. Ejemplo: 1 5 3 3 3';return}const p=calcularPuntaje(v);document.getElementById('resultado').textContent='Puntaje de la tirada: '+p;if(p===0){document.getElementById('mensaje').textContent='¡PAPA! No salió ningún dado que puntúe. Perdés todo el turno.';turnoPuntos=0;document.getElementById('puntajeTurno').textContent='0';cambiarJugador();return}turnoPuntos+=p;document.getElementById('puntajeTurno').textContent=turnoPuntos;document.getElementById('mensaje').textContent='Sumaste '+p+' al turno. Podés seguir o plantarte.'}
function plantarse(){if(turnoPuntos===0){document.getElementById('mensaje').textContent='Primero conseguí puntos en el turno.';return}if(!yaEntro[jugadorActual]){if(turnoPuntos<750){document.getElementById('mensaje').textContent='Para empezar a anotar necesitás 750 puntos o más en un solo turno.';return}yaEntro[jugadorActual]=true}puntos[jugadorActual]+=turnoPuntos;actualizarMarcador();if(puntos[jugadorActual]>=10000){document.getElementById('mensaje').textContent=nombre()+' llegó a 10.000 y gana la partida. 🏆';document.querySelectorAll('button').forEach(b=>b.disabled=true);return}pasarTurno()}
function papa(){turnoPuntos=0;document.getElementById('puntajeTurno').textContent='0';document.getElementById('resultado').textContent='Puntaje de la tirada: 0';document.getElementById('mensaje').textContent='¡PAPA! Perdés todo lo acumulado en este turno.';limpiarDados();cambiarJugador()}
function pasarTurno(){turnoPuntos=0;document.getElementById('puntajeTurno').textContent='0';document.getElementById('resultado').textContent='Puntaje de la tirada: 0';document.getElementById('mensaje').textContent='';limpiarDados();cambiarJugador()}
function limpiarDados(){entradaDados.value='';entradaDados.focus()}
function cambiarJugador(){jugadorActual=jugadorActual===0?1:0;document.getElementById('jugador1').classList.toggle('activo',jugadorActual===0);document.getElementById('jugador2').classList.toggle('activo',jugadorActual===1);document.getElementById('turno').textContent='Turno de '+nombre()}
function actualizarMarcador(){document.getElementById('puntos1').textContent=puntos[0];document.getElementById('puntos2').textContent=puntos[1]}
function reiniciar(){puntos=[0,0];yaEntro=[false,false];jugadorActual=0;turnoPuntos=0;actualizarMarcador();document.getElementById('puntajeTurno').textContent='0';document.getElementById('resultado').textContent='Puntaje de la tirada: 0';document.getElementById('mensaje').textContent='';document.getElementById('turno').textContent='Turno de '+nombre();document.getElementById('jugador1').classList.add('activo');document.getElementById('jugador2').classList.remove('activo');document.querySelectorAll('button').forEach(b=>b.disabled=false);limpiarDados()}
</script>
</body>
</html>
