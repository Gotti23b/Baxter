<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Papa / 10.000</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; padding: 20px; font-family: Arial, sans-serif; background: #0f172a; color: white; }
        .contenedor { max-width: 760px; margin: auto; background: #111827; padding: 24px; border-radius: 20px; }
        h1, h2 { text-align: center; }
        .jugadores { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
        .jugador { background: #1f2937; padding: 16px; border-radius: 16px; text-align: center; }
        input, select, button { font: inherit; }
        .nombre, select { width: 100%; padding: 10px; border: 1px solid #475569; border-radius: 10px; background: #0f172a; color: white; }
        .puntos { font-size: 38px; font-weight: bold; color: #22d3ee; margin: 12px 0; }
        .activo { outline: 2px solid #22d3ee; }
        .seccion { margin-top: 18px; padding: 18px; background: #1f2937; border-radius: 16px; }
        .dados { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin: 12px 0; }
        button { padding: 11px 14px; border: 0; border-radius: 10px; cursor: pointer; font-weight: bold; margin: 4px; }
        .principal { background: #22d3ee; color: #061018; }
        .secundario { background: #334155; color: white; }
        .peligro { background: #7f1d1d; color: white; }
        .turno, .resultado, .mensaje { text-align: center; }
        .turno { font-size: 18px; margin: 10px 0; }
        .resultado { font-size: 24px; color: #22d3ee; font-weight: bold; }
        .mensaje { min-height: 24px; margin: 10px 0; }
        @media (max-width: 600px) { .jugadores { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
<main class="contenedor">
    <h1>🥔 La Papa / 10.000</h1>

    <div class="jugadores">
        <section class="jugador activo" id="jugador1">
            <input class="nombre" id="nombre1" value="Jugador 1">
            <div class="puntos" id="puntos1">0</div>
        </section>
        <section class="jugador" id="jugador2">
            <input class="nombre" id="nombre2" value="Jugador 2">
            <div class="puntos" id="puntos2">0</div>
        </section>
    </div>

    <section class="seccion">
        <div class="turno" id="turno">Turno de Jugador 1</div>
        <h2>🎲 Tirada de 5 dados</h2>
        <div class="dados">
            <select class="dado"><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option></select>
            <select class="dado"><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option></select>
            <select class="dado"><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option></select>
            <select class="dado"><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option></select>
            <select class="dado"><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option></select>
        </div>
        <div class="resultado" id="resultado">Puntaje de la tirada: 0</div>
        <div class="mensaje" id="mensaje"></div>
        <div style="text-align:center">
            <button class="principal" onclick="calcularTirada()">Calcular tirada</button>
            <button class="secundario" onclick="plantarse()">Plantarse y anotar</button>
            <button class="peligro" onclick="papa()">🥔 ¡PAPA!</button>
        </div>
    </section>

    <section class="seccion">
        <div style="text-align:center">
            <strong>Puntaje del turno: </strong><span id="puntajeTurno">0</span>
            <br><br>
            <button class="secundario" onclick="pasarTurno()">Pasar turno</button>
            <button class="peligro" onclick="reiniciar()">Reiniciar partida</button>
        </div>
    </section>
</main>

<script>
    const dados = document.querySelectorAll('.dado');
    let puntos = [0, 0];
    let jugadorActual = 0;
    let turnoPuntos = 0;
    let yaEntro = [false, false];

    function nombre() {
        return document.getElementById('nombre' + (jugadorActual + 1)).value || ('Jugador ' + (jugadorActual + 1));
    }

    function calcularPuntaje(valores) {
        const cuenta = [0, 0, 0, 0, 0, 0, 0];
        valores.forEach(v => cuenta[v]++);
        let puntaje = 0;

        // En esta versión de La Papa, una escalera de 5 dados vale 500.
        if ((cuenta[1] && cuenta[2] && cuenta[3] && cuenta[4] && cuenta[5]) ||
            (cuenta[2] && cuenta[3] && cuenta[4] && cuenta[5] && cuenta[6])) {
            return 500;
        }

        // Un trío cuenta una sola vez por cada número.
        for (let n = 1; n <= 6; n++) {
            if (cuenta[n] >= 3) {
                puntaje += n === 1 ? 1000 : n * 100;
            }
        }

        // Los unos y cincos que no forman parte de un trío también puntúan.
        if (cuenta[1] < 3) puntaje += cuenta[1] * 100;
        if (cuenta[5] < 3) puntaje += cuenta[5] * 50;

        return puntaje;
    }

    function todosPuntuan(valores) {
        const cuenta = [0, 0, 0, 0, 0, 0, 0];
        valores.forEach(v => cuenta[v]++);
        if (valores.length === 5 &&
            ((cuenta[1] && cuenta[2] && cuenta[3] && cuenta[4] && cuenta[5]) ||
             (cuenta[2] && cuenta[3] && cuenta[4] && cuenta[5] && cuenta[6]))) return true;
        let puntuantes = 0;
        for (let n = 1; n <= 6; n++) {
            if (cuenta[n] >= 3) puntuantes += 3;
            if (n === 1 || n === 5) puntuantes += Math.max(0, cuenta[n] - 3);
        }
        return puntuantes === 5;
    }

    function calcularTirada() {
        const valores = [...dados].map(d => Number(d.value));
        const puntosTirada = calcularPuntaje(valores);
        document.getElementById('resultado').textContent = 'Puntaje de la tirada: ' + puntosTirada;

        if (puntosTirada === 0) {
            document.getElementById('mensaje').textContent = '¡PAPA! No salió ningún 1, 5, trío ni escalera. Perdés el turno.';
            turnoPuntos = 0;
            document.getElementById('puntajeTurno').textContent = '0';
            cambiarJugador();
            return;
        }

        turnoPuntos += puntosTirada;
        document.getElementById('puntajeTurno').textContent = turnoPuntos;
        document.getElementById('mensaje').textContent = 'Sumaste ' + puntosTirada + ' al turno. Podés seguir o plantarte.';

        if (todosPuntuan(valores)) {
            document.getElementById('mensaje').textContent += ' ¡Los 5 dados puntúan! Podés volver a tirar los 5.';
        }
    }

    function plantarse() {
        if (turnoPuntos === 0) {
            document.getElementById('mensaje').textContent = 'Primero conseguí puntos en el turno.';
            return;
        }
        if (!yaEntro[jugadorActual]) {
            if (turnoPuntos < 750) {
                document.getElementById('mensaje').textContent = 'Para empezar a anotar necesitás 750 puntos o más en un solo turno.';
                return;
            }
            yaEntro[jugadorActual] = true;
        }
        puntos[jugadorActual] += turnoPuntos;
        actualizarMarcador();

        if (puntos[jugadorActual] >= 5000) {
            document.getElementById('mensaje').textContent = nombre() + ' llegó a 5000 y gana la partida. 🏆';
            document.querySelectorAll('button').forEach(b => b.disabled = true);
            return;
        }
        pasarTurno();
    }

    function papa() {
        turnoPuntos = 0;
        document.getElementById('puntajeTurno').textContent = '0';
        document.getElementById('resultado').textContent = 'Puntaje de la tirada: 0';
        document.getElementById('mensaje').textContent = '¡PAPA! Perdés todo lo acumulado en este turno.';
        cambiarJugador();
    }

    function pasarTurno() {
        turnoPuntos = 0;
        document.getElementById('puntajeTurno').textContent = '0';
        document.getElementById('resultado').textContent = 'Puntaje de la tirada: 0';
        document.getElementById('mensaje').textContent = '';
        cambiarJugador();
    }

    function cambiarJugador() {
        jugadorActual = jugadorActual === 0 ? 1 : 0;
        document.getElementById('jugador1').classList.toggle('activo', jugadorActual === 0);
        document.getElementById('jugador2').classList.toggle('activo', jugadorActual === 1);
        document.getElementById('turno').textContent = 'Turno de ' + nombre();
    }

    function actualizarMarcador() {
        document.getElementById('puntos1').textContent = puntos[0];
        document.getElementById('puntos2').textContent = puntos[1];
    }

    function reiniciar() {
        puntos = [0, 0];
        yaEntro = [false, false];
        jugadorActual = 0;
        turnoPuntos = 0;
        actualizarMarcador();
        document.getElementById('puntajeTurno').textContent = '0';
        document.getElementById('resultado').textContent = 'Puntaje de la tirada: 0';
        document.getElementById('mensaje').textContent = '';
        document.getElementById('turno').textContent = 'Turno de ' + nombre();
        document.getElementById('jugador1').classList.add('activo');
        document.getElementById('jugador2').classList.remove('activo');
        document.querySelectorAll('button').forEach(b => b.disabled = false);
    }
</script>
</body>
</html>
